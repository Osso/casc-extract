[package]
name = "casc-extract"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
cascette-protocol = { git = "https://github.com/Osso/cascette-rs", rev = "d8ec31f4dabaaff80af64b2510c54104a1871fec" }
cascette-formats = { git = "https://github.com/Osso/cascette-rs", rev = "d8ec31f4dabaaff80af64b2510c54104a1871fec" }
cascette-client-storage = { git = "https://github.com/Osso/cascette-rs", rev = "d8ec31f4dabaaff80af64b2510c54104a1871fec" }
cascette-crypto = { git = "https://github.com/Osso/cascette-rs", rev = "d8ec31f4dabaaff80af64b2510c54104a1871fec" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hex = "0.4"
reqwest = { version = "0.12", features = ["rustls-tls"] }
