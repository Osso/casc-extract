[package]
name = "casc-extract"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
cascette-protocol = { git = "https://github.com/Osso/cascette-rs", path = "crates/cascette-protocol" }
cascette-formats = { git = "https://github.com/Osso/cascette-rs", path = "crates/cascette-formats" }
cascette-client-storage = { git = "https://github.com/Osso/cascette-rs", path = "crates/cascette-client-storage" }
cascette-crypto = { git = "https://github.com/Osso/cascette-rs", path = "crates/cascette-crypto" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hex = "0.4"
reqwest = { version = "0.12", features = ["rustls-tls"] }
